<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alsura | Web Developer Portfolio</title>

    <style>
        /* Global Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            background: #f8f9fa;
            color: #495057;
        }

        section {
            padding: 80px 15%;
            text-align: center;
        }

        h1, h2 {
            color: #343a40;
        }

        /* Navigation */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            background-color: #007bff;
            color: white;
            padding: 15px 10%;
            z-index: 1000;
        }

        nav ul {
            display: flex;
            justify-content: space-around;
            list-style: none;
            align-items: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-size: 1.1rem;
            padding: 10px;
        }

        nav a:hover {
            background-color: #0056b3;
            border-radius: 5px;
        }

        /* Home Section */
        #home {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        #home h1 {
            font-size: 4rem;
            margin-bottom: 20px;
        }

        #home p {
            font-size: 1.2rem;
            max-width: 700px;
        }

        /* About Section */
        #about {
            background: white;
        }

        #about p {
            margin-top: 20px;
            font-size: 1.1rem;
            max-width: 800px;
            margin: 0 auto;
        }

        /* Portfolio Section */
        #portfolio {
            background: #e9ecef;
        }

        .portfolio-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .portfolio-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        /* Skills Section */
        #skills {
            background: white;
        }

        .skills-list {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 30px;
            margin-top: 30px;
        }

        .skill-item {
            background: #28a745;
            color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 200px;
            text-align: center;
        }

        /* Contact Section */
        #contact {
            background: #f1f3f5;
        }

        form {
            max-width: 500px;
            margin: 0 auto;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 8px;
            border: 1px solid #ced4da;
        }

        textarea {
            resize: none;
            height: 150px;
        }

        button {
            background-color: #007bff;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        /* Footer */
        footer {
            background: #007bff;
            color: white;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>

    <!-- Navigation -->
    <nav>
        <ul>
            <li><strong>Alsura</strong></li>
            <li>
                <a href="#home">Home</a>
                <a href="#about">About</a>
                <a href="#portfolio">Portfolio</a>
                <a href="#skills">Skills</a>
                <a href="#contact">Contact</a>
            </li>
        </ul>
    </nav>

    <!-- Home Section -->
    <section id="home">
        <div>
            <h1>Hello, I'm Alsura</h1>
        </div>
    </section>

    <!-- About Section -->
    <section id="about">
        <h2>About Me</h2>
        <p>
            I am a web developer .
        </p>
    </section>

    <!-- Portfolio Section -->
    <section id="portfolio">
        <h2>Images</h2>
        <p>Here are a few Images:</p>

        <div class="portfolio-grid">
            <div class="portfolio-item">
                <img src="https://via.placeholder.com/400" alt="Project 1">
            </div>
            <div class="portfolio-item">
                <img src="https://via.placeholder.com/400" alt="Project 2">
            </div>
            <div class="portfolio-item">
                <img src="https://via.placeholder.com/400" alt="Project 3">
            </div>
        </div>
    </section>

    <!-- Skills Section -->
<div>
<iframe width="560" height="315" src="https://www.youtube.com/embed/kPa7bsKwL-c?si=dzzar-PU-QKp0rvj" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
</div>

    <!-- Contact Section -->
    <section id="contact">
        <h2>Contact Me</h2>
        <form>
            <input type="text" placeholder="Your Name" required>
            <input type="email" placeholder="Your Email" required>
            <textarea placeholder="Your Message"></textarea>
            <button type="submit">Send Message</button>
        </form>
    </section>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Alsura. All rights reserved.</p>
    </footer>

</body>
</html>
